<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CCManager - Prototipo</title>
    <link rel="stylesheet" href="prototype.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación de cuenta">
        <button class="side-link" type="button">Mis datos</button>
        <button class="side-link" type="button">Mis productos</button>
        <button class="side-link functional-highlight" type="button" data-view-button="subscriptions">Mis suscripciones</button>
        <button class="side-link" type="button">Mis pedidos</button>
        <button class="side-link functional-highlight is-active" type="button" data-view-button="payments">Mis tarjetas guardadas</button>
        <button class="side-link" type="button">Support</button>
        <button class="register-button" type="button" data-add-trial-subscription>Registrar mis Productos</button>
      </aside>

      <main class="main-content">
        <section class="view" id="subscriptions-view" aria-labelledby="subscriptions-title">
          <div class="product-tabs" aria-label="Categorías de productos">
            <button class="product-tab" type="button">Mis GPS</button>
            <button class="product-tab" type="button">Mis softwares</button>
            <button class="product-tab" type="button">Mis mapas</button>
            <button class="product-tab is-selected" type="button" id="subscriptions-title">Mis suscripciones</button>
          </div>
          <div class="subscription-list" id="subscription-list"></div>
        </section>

        <section class="view is-visible" id="payments-view" aria-labelledby="payments-title">
          <div class="panel">
            <div class="panel-header">
              <h1 id="payments-title">Mis tarjetas guardadas</h1>
            </div>
            <div class="payment-list" id="payment-list"></div>
          </div>

          <div class="panel add-card-panel">
            <div class="panel-header">
              <h2>Añadir nueva tarjeta</h2>
            </div>
            <form class="add-card-form" id="add-card-form">
              <p class="form-title">Introduce los datos de tu tarjeta:</p>
              <div class="card-fields" aria-label="Datos de tarjeta de demostración">
                <label class="field wide">
                  <span>Número</span>
                  <input autocomplete="off" inputmode="numeric" maxlength="19" placeholder="1234 1234 1234 1234">
                </label>
                <label class="field">
                  <span>Caducidad</span>
                  <input autocomplete="off" inputmode="numeric" maxlength="5" placeholder="MM / AA">
                </label>
                <label class="field short">
                  <span>CVC</span>
                  <input autocomplete="off" inputmode="numeric" maxlength="4" placeholder="CVC">
                </label>
              </div>
              <p class="security-note"><span class="lock-icon" aria-hidden="true"></span>Los detalles de tu tarjeta están protegidos usando los estándares de seguridad PCI DSS v3.2</p>
              <button class="primary-button" type="submit">Guardar la tarjeta</button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <div class="modal-backdrop" id="payment-modal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="payment-modal-title">
        <button class="modal-close" type="button" data-close-modal aria-label="Cerrar">×</button>
        <h2 id="payment-modal-title">Cambiar método de pago</h2>
        <p class="modal-subtitle" id="payment-modal-subtitle"></p>
        <div class="modal-card-list" id="modal-card-list"></div>
        <div class="modal-divider"></div>
        <button class="secondary-button add-new-toggle" type="button" id="show-new-card">Añadir nueva</button>
        <form class="modal-new-card" id="modal-new-card" hidden>
          <div class="compact-fields">
            <label class="field wide">
              <span>Número</span>
              <input autocomplete="off" inputmode="numeric" maxlength="19" placeholder="1234 1234 1234 1234">
            </label>
            <label class="field">
              <span>Caducidad</span>
              <input autocomplete="off" inputmode="numeric" maxlength="5" placeholder="MM / AA">
            </label>
          </div>
          <button class="primary-button" type="submit">Guardar y asignar</button>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="message-modal" hidden>
      <section class="modal message-modal" role="dialog" aria-modal="true" aria-labelledby="message-modal-title">
        <button class="modal-close" type="button" data-close-message aria-label="Cerrar">×</button>
        <h2 id="message-modal-title"></h2>
        <p id="message-modal-body"></p>
        <div class="modal-actions" id="message-modal-actions"></div>
      </section>
    </div>

    <script src="prototype.js" defer></script>
  </body>
</html>
